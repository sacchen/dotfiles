name: Dotfiles Safety Checks

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Full public audit
        run: ./scripts/public-audit.sh
